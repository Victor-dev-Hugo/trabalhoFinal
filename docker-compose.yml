# TP03 - Docker Compose: site estatico (Nginx customizado) + API Python
services:
  site:
    build: ./site
    image: meu-site-nginx:1.0
    container_name: tp03_site
    ports:
      - "8080:80"        # host:container
    depends_on:
      - api

  api:
    build: ./api
    image: minha-api-python:1.0
    container_name: tp03_api
    ports:
      - "8081:8000"      # host:container
    environment:
      - APP_PORT=8000
    restart: unless-stopped
